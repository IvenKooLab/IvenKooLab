name: badge-pr-bot
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append log line
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" >> .badge-log.txt
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: append badge log"
          title: "chore: append badge log"
          body: "Automated one-line log append."
          branch: bot/badge-log
          add-paths: .badge-log.txt
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
